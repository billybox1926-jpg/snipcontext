name: Semantic Extra Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-semantic:
    name: Test semantic extra (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-semantic-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-semantic-${{ runner.os }}-${{ matrix.python-version }}-
            hf-semantic-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,semantic]"

      - name: Run tests
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          uv run pytest tests/arm/test_fallback.py -v --tb=short -m "not slow"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-test-logs-${{ matrix.python-version }}
          path: .pytest_cache/

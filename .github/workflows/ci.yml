name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - feature-update

permissions:
  contents: read

jobs:
  # ── Lint & type-check ─────────────────────────────────────────────
  quality:
    name: Quality (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff lint & fix
        run: |
          uv run ruff check --fix src/snipcontext tests
          uv run ruff format --check src/snipcontext tests

      - name: Mypy type check
        run: uv run mypy src/snipcontext --ignore-missing-imports --no-site-packages

  # ── Tests across Python versions ─────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-models-${{ runner.os }}-${{ matrix.python-version }}-
            hf-models-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,web]"

      - name: Run tests
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          uv run pytest -q --tb=short -m "not slow" --cov=src/snipcontext --cov-report=term-missing

      - name: Run slow tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          uv run pytest -q --tb=short -m "slow"

  # ── Full semantic dependency matrix ──────────────────────────────
  test-semantic:
    name: Test semantic extra (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-semantic-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-semantic-${{ runner.os }}-${{ matrix.python-version }}-
            hf-semantic-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,semantic]"

      - name: Run tests
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          uv run pytest -q --tb=short -m "not slow" --cov=src/snipcontext --cov-report=term-missing

  # ── Minimal install (no optional extras) ──────────────────────────
  test-minimal:
    name: Test minimal install (no optional extras)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (minimal — no optional extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Verify optional deps are NOT installed
        run: |
          uv run python -c "
          try:
              import sentence_transformers
              print('ERROR: sentence_transformers should not be installed')
              raise SystemExit(1)
          except ImportError:
              print('OK: sentence_transformers not installed (expected)')

          try:
              import faiss
              print('ERROR: faiss should not be installed')
              raise SystemExit(1)
          except ImportError:
              print('OK: faiss not installed (expected)')

          try:
              import fastapi
              print('ERROR: fastapi should not be installed')
              raise SystemExit(1)
          except ImportError:
              print('OK: fastapi not installed (expected)')
          "

      - name: Run tests (non-slow only)
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          uv run pytest -q --tb=short -m "not slow" --cov=src/snipcontext --cov-report=term-missing --cov-fail-under=0

      - name: Verify optional-dep modules import cleanly
        shell: bash
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          uv run python -c "
          from snipcontext.core.search import SEMANTIC_AVAILABLE, HybridSearch, KeywordIndex
          assert not SEMANTIC_AVAILABLE, 'SEMANTIC_AVAILABLE should be False'
          print('OK: SEMANTIC_AVAILABLE=False')

          from snipcontext.web import WEB_AVAILABLE
          assert not WEB_AVAILABLE, 'WEB_AVAILABLE should be False'
          print('OK: WEB_AVAILABLE=False')

          from snipcontext.core.models import SearchMode
          print('OK: all search/web classes importable without optional deps')
          "

  # ── Build & verify package ───────────────────────────────────────
  build:
    name: Build & verify
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install build tools
        run: uv pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

  # ── ARM via QEMU ──────────────────────────────────────────────────
  test-arm:
    name: Test on ARM (${{ matrix.arch }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Run tests on ARM
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y python3 python3-pip python3-venv git
          run: |
            export PYTHONPATH="$(pwd)/src"
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -e ".[dev]"
            uv run pytest tests/test_storage.py tests/test_search_history.py tests/test_config.py -v --tb=short

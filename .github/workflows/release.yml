name: Release

# Single source of truth for publishing to PyPI.
#
# Fires on a version tag push. The previous setup had this workflow AND
# publish.yml (on `release: published`) both building and publishing, so a
# tag-push-then-create-release flow ran two independent builds with two
# different auth methods, build commands, and Python versions. publish.yml has
# been removed; the pieces worth keeping from it live here:
#   - the already-published guard, so a re-run skips instead of erroring
#   - the post-publish install verification
# Auth is OIDC trusted publishing (no stored token), which is why the
# id-token: write permission below is required.
on:
  push:
    tags:
      - 'v*'
  # Manual re-run without moving a tag (e.g. after a transient PyPI failure).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Guard carried over from the old publish.yml: PyPI rejects a re-upload of
      # an existing version, so check first and skip the rest rather than fail.
      - name: Check version is new
        id: check_version
        run: |-
          python -m pip install --upgrade pip
          pip install requests
          python - <<'EOF'
          import os
          import re

          import requests

          with open("src/snipcontext/__init__.py") as f:
              content = f.read()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', content)
          if not match:
              print("::error::Could not find __version__ in __init__.py")
              raise SystemExit(1)
          version = match.group(1)

          url = "https://pypi.org/pypi/snipcontext/json"
          try:
              r = requests.get(url, timeout=10)
              already = r.status_code == 200 and version in r.json().get("releases", {})
          except requests.RequestException as exc:
              # Do not silently skip a real release because PyPI was unreachable.
              print(f"::error::Could not reach PyPI to check version {version}: {exc}")
              raise SystemExit(1)

          if already:
              print(f"::warning::Version {version} already on PyPI; skipping publish.")
          else:
              print(f"OK: version {version} is new, proceeding")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"already_published={str(already).lower()}\n")
              fh.write(f"version={version}\n")
          EOF

      - name: Build package
        if: steps.check_version.outputs.already_published != 'true'
        run: uv build

      - name: Verify package
        if: steps.check_version.outputs.already_published != 'true'
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Publish to PyPI
        if: steps.check_version.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      # Verification carried over from the old publish.yml. PyPI's CDN needs a
      # moment before a fresh version resolves.
      - name: Verify install
        if: steps.check_version.outputs.already_published != 'true'
        run: |-
          sleep 30
          pip install "snipcontext==${{ steps.check_version.outputs.version }}" --no-cache-dir
          python -c "import snipcontext; print(f'snipcontext {snipcontext.__version__} installed OK')"
          snipcontext --help
